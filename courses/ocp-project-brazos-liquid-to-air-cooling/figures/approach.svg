<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750"><rect width="1600" height="750" fill="white"/><g font-family="Open Sans,Arial,sans-serif"><rect x="70" y="120" width="430" height="260" rx="18" fill="#f3f5f7" stroke="#343895" stroke-width="3"/><rect x="585" y="120" width="430" height="260" rx="18" fill="#f3f5f7" stroke="#343895" stroke-width="3"/><rect x="1100" y="120" width="430" height="260" rx="18" fill="#eff7e6" stroke="#343895" stroke-width="3"/><text x="285" y="190" font-size="28" font-weight="600" fill="#343895" text-anchor="middle">LIQUID SUPPLY</text><text x="285" y="285" font-size="76" font-weight="600" fill="#343895" text-anchor="middle">37 °C</text><text x="800" y="190" font-size="28" font-weight="600" fill="#343895" text-anchor="middle">INLET AIR</text><text x="800" y="285" font-size="76" font-weight="600" fill="#343895" text-anchor="middle">29 °C</text><text x="1315" y="190" font-size="28" font-weight="600" fill="#343895" text-anchor="middle">APPROACH</text><text x="1315" y="285" font-size="76" font-weight="600" fill="#343895" text-anchor="middle">8 °C</text><text x="542" y="267" font-size="50" font-weight="600" fill="#343895" text-anchor="middle">−</text><text x="1057" y="267" font-size="50" font-weight="600" fill="#343895" text-anchor="middle">=</text><text x="800" y="490" font-size="34" font-weight="600" fill="#343895" text-anchor="middle">Same approach + warmer inlet air → warmer liquid supply</text><text x="800" y="555" font-size="28" font-weight="600" fill="#5F6062" text-anchor="middle">Liquid return temperature rise is a separate quantity.</text><text x="800" y="662" font-size="22" font-weight="600" fill="#5F6062" text-anchor="middle">ILLUSTRATIVE TEMPERATURES</text></g></svg>