<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts/open-sans.css"><style>html,body{margin:0;background:white;width:1920px;height:900px;overflow:hidden}#stage{width:1920px;height:900px}</style><div id="stage"></div><script src="engine.js"></script><script>const storyboard={"asset": "service_interlock", "module": 3, "slide": 6, "chapters": [{"label": "Three chassis on slides", "narration": "Consider the physical service arrangement with three chassis mounted on slides. Each unit is heavy, and extending a chassis moves its load forward. The rack must remain stable throughout the approved service activity. The diagram explains the interlock principle; it is not a replacement sequence.", "start": 0.0, "end": 17.84140589569161, "speech_duration": 17.46140589569161}, {"label": "One chassis extends", "narration": "When one chassis extends, the interlock must prevent another chassis from extending at the same time. This mechanism is separate from the securing features used to hold equipment in place. Simply releasing a mounting restraint must not allow an operator to defeat the one-chassis condition accidentally.", "start": 17.84140589569161, "end": 34.707573696145126, "speech_duration": 16.486167800453515}, {"label": "Second extension is blocked", "narration": "A second extension attempt remains blocked while the first unit is out. This protects against the tipping condition the interlock is designed to prevent. The specification also requires warnings and validation of the mechanism. A functioning drawing is not evidence that a particular rack has passed those tests.", "start": 34.707573696145126, "end": 51.62018140589569, "speech_duration": 16.532607709750568}, {"label": "Leak coverage is independent", "narration": "Leak coverage is an independent requirement. Each chassis needs its own detection, including an internal cable and an external connection for the specified coverage. Minor internal leaks must be contained and routed toward controlled front drainage. The specification does not permit one chassis’s leak detection to be daisy-chained through another.", "start": 51.62018140589569, "end": 70.48326530612245, "speech_duration": 18.483083900226756}, {"label": "Check all three conditions", "narration": "Bring these checks together without confusing their purposes. The interlock addresses physical extension and rack stability. Detection and drainage address escaped liquid. Cooling continuity still depends on the remaining equipment and the approved service plan. Satisfying one of these conditions does not prove the others.", "start": 70.48326530612245, "end": 88.45532879818595, "speech_duration": 17.322086167800453}], "duration": 88.45532879818595, "source_pages": [39, 44, 63, 64], "narration_wav": "audio/module3/slide_06_service_one_chassis_while_protecting_the_rack.wav", "narration_sha256": "9609e2f6ff0ff1265a9cd166108fc40803fca2e9dd495a1a2539c16b73be3149", "timing_status": "Measured final narration; one finite pass"};window.animationDuration=storyboard.duration;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=BrazosVideo.render(storyboard,Math.min(storyboard.duration-.001,Math.max(0,ms/1000)))};renderAtTime(0);</script>
