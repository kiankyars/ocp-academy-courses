<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts/open-sans.css"><style>html,body{margin:0;background:white;width:1920px;height:900px;overflow:hidden}#stage{width:1920px;height:900px}</style><div id="stage"></div><script src="engine.js"></script><script>const storyboard={"asset": "heat_path", "module": 1, "slide": 4, "chapters": [{"label": "IT adds heat", "narration": "Begin at the equipment. Heat enters the coolant through the I T cooling interfaces. The liquid leaves the I T equipment warmer and returns toward the Brazos rack. This is a single-phase loop: the teaching model keeps the fluid liquid while its temperature changes.", "start": 0.0, "end": 15.101451247165533, "speech_duration": 14.721451247165533}, {"label": "Radiator transfers heat", "narration": "Inside Brazos, the returning coolant passes through the radiator. The liquid and air remain separate streams. Heat transfers across the heat-exchanger surfaces. The radiator changes the coolant temperature; it does not send that coolant into a facility water loop.", "start": 15.101451247165533, "end": 31.131700680272107, "speech_duration": 15.650249433106575}, {"label": "Liquid returns to IT", "narration": "The pumps circulate the cooled liquid back through the supply manifold and onward to the I T equipment. The closed path connects supply, I T load, return, and Brazos again. Its hydraulic resistance matters because circulation must provide the required flow through the actual installation.", "start": 31.131700680272107, "end": 48.09074829931973, "speech_duration": 16.579047619047618}, {"label": "Air carries heat away", "narration": "On the air side, the rear fans draw inlet air through the chassis and discharge warmer air into the hot aisle. The room’s air-handling and heat-removal systems receive that heat. They remain part of the end-to-end cooling system, even though the I T uses liquid.", "start": 48.09074829931973, "end": 63.145759637188206, "speech_duration": 14.675011337868481}, {"label": "Verify both paths", "narration": "Keep both paths in your review. One carries coolant through the equipment and Brazos. The other carries air through the radiator and toward the facility cooling system. Brazos connects their thermal behavior. Reliable operation requires suitable conditions on both sides of that connection.", "start": 63.145759637188206, "end": 79.77106575963718, "speech_duration": 15.975328798185942}], "duration": 79.77106575963718, "source_pages": [12, 13, 18], "narration_wav": "audio/module1/slide_04_from_it_heat_to_the_hot_aisle.wav", "narration_sha256": "61155812d0ae3e08b1400ddb86f8f2535b41747685dec84a13a0e29141fd532b", "timing_status": "Measured final narration; one finite pass", "visual_motion": "Continuous directional coolant markers and air streaks; rotating chassis-fan symbol after its narration cue. Speeds and spacing are illustrative. Final one second holds still.", "revision_note": "2026-09-29: replaced five long static states with visible motion within the narration-aligned scenes after reviewer feedback."};window.animationDuration=storyboard.duration;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=BrazosVideo.render(storyboard,Math.min(storyboard.duration-.001,Math.max(0,ms/1000)))};renderAtTime(0);</script>
