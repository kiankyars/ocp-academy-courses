<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts/open-sans.css"><style>html,body{margin:0;background:white;width:1920px;height:900px;overflow:hidden}#stage{width:1920px;height:900px}</style><div id="stage"></div><script src="engine.js"></script><script>const storyboard={"asset": "control_states", "module": 4, "slide": 4, "chapters": [{"label": "Verify liquid before enable", "narration": "Start with the liquid-presence condition. Pumps must not turn on simply because the power board is inserted into the live rack busbar. The controller must verify liquid using the specified suction-pressure or liquid-level evidence before enabling the pump drives. This prevents dry running.", "start": 0.0, "end": 18.49156462585034, "speech_duration": 18.11156462585034}, {"label": "Separate startup and reboot", "narration": "Initial startup and reboot are different cases. The configurable initial defaults are manual mode with pump and fan speeds at twenty-five percent. A reboot after a power interruption or software update must retain the controller’s preceding state. Do not treat the initial default as a command to reset every restart to manual operation.", "start": 18.49156462585034, "end": 38.190566893424034, "speech_duration": 19.319002267573698}, {"label": "Enter supervisory bounds", "narration": "During normal automatic operation, the local controller regulates the selected pump and fan variables. A tier-two supervisory system may impose minimum and maximum speed bounds. To enter that mode, it writes a positive timeout value. The local controller decrements that value once each second.", "start": 38.190566893424034, "end": 55.47469387755102, "speech_duration": 16.904126984126986}, {"label": "Timeout returns to local control", "narration": "While the timeout remains positive, the controller applies the supervisory bounds and slews toward them at a safe rate where necessary. When the timeout reaches zero, it exits tier-two operation with a smooth transfer back to local control. The timeout is a control-handover mechanism, not proof of a deployed facility optimization service.", "start": 55.47469387755102, "end": 74.10557823129251, "speech_duration": 18.250884353741498}, {"label": "Validate separate fault branches", "narration": "Failures are separate branches. The specification defines default full-speed responses for particular sensor, communication, pump, or fan failures, and also describes a manual mode that overrides failsafe conditions. Validate those state-specific behaviors, including their interaction with the installed controls. Avoid assuming every abnormal condition has the same response or inventing an undocumented priority rule.", "start": 74.10557823129251, "end": 98.90430839002268, "speech_duration": 24.14875283446712}], "duration": 98.90430839002268, "source_pages": [68, 70, 71, 72], "narration_wav": "audio/module4/slide_04_from_startup_to_supervisory_handover.wav", "narration_sha256": "cfb497591618d8346026b7b26299b2a3ed8e2fd82cfe3b098d573a41d85e3aec", "timing_status": "Measured final narration; one finite pass"};window.animationDuration=storyboard.duration;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=BrazosVideo.render(storyboard,Math.min(storyboard.duration-.001,Math.max(0,ms/1000)))};renderAtTime(0);</script>
