<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts/open-sans.css"><style>html,body{margin:0;background:white;width:1920px;height:900px;overflow:hidden}#stage{width:1920px;height:900px}</style><div id="stage"></div><script src="engine.js"></script><script>const storyboard={"asset": "fan_tradeoff", "module": 2, "slide": 4, "chapters": [{"label": "Compare chassis data", "narration": "Fan speed changes both airflow and electrical demand. The chassis data provides measured comparison points, which we will keep separate from the rack-level thermal table. Here, airflow is reported as standard cubic feet per minute, and power refers to the chassis fans.", "start": 0.0, "end": 15.426530612244898, "speech_duration": 15.046530612244897}, {"label": "54% and 65% speed", "narration": "At fifty-four percent fan speed, the table lists twelve hundred twenty-two standard cubic feet per minute and three hundred six watts of fan power. At sixty-five percent, the airflow rises to fifteen hundred fifty-five, while power rises to five hundred sixty-six watts. These are two operating points, not a promise about every installed condition.", "start": 15.426530612244898, "end": 34.61469387755102, "speech_duration": 18.808163265306124}, {"label": "76% and 88% speed", "narration": "At seventy-six percent speed, airflow is eighteen hundred seventy-seven and fan power is eight hundred eighty-four watts. At eighty-eight percent, those figures become twenty-two hundred thirteen and thirteen hundred twenty-seven watts. The gain in airflow comes with a growing electrical cost.", "start": 34.61469387755102, "end": 52.03814058956916, "speech_duration": 17.04344671201814}, {"label": "Full-speed comparison", "narration": "At full speed, the listed airflow reaches twenty-six hundred twenty-two standard cubic feet per minute, with nineteen hundred eighty-two watts of fan power. Compared with the fifty-four-percent point, that is a little over twice the airflow and roughly six and a half times the fan power. This comparison uses the table entries; it is not a fitted fan law.", "start": 52.03814058956916, "end": 71.87646258503402, "speech_duration": 19.458321995464853}, {"label": "Choose against the requirement", "narration": "Select a working point against the actual thermal requirement and air-path resistance. Maximum speed is available for particular conditions, including specified failure responses, but it carries a power and acoustic consequence. Keep chassis fan power distinct from pump power and total cooling-rack power when assembling the site budget.", "start": 71.87646258503402, "end": 91.10240362811791, "speech_duration": 18.575963718820862}], "duration": 91.10240362811791, "source_pages": [19], "narration_wav": "audio/module2/slide_04_airflow_has_a_power_cost.wav", "narration_sha256": "d15456d93ecb9224cd055bccffffe2446be0f4086003b62cfa495fd564304a39", "timing_status": "Measured final narration; one finite pass"};window.animationDuration=storyboard.duration;window.renderAtTime=function(ms){document.getElementById('stage').innerHTML=BrazosVideo.render(storyboard,Math.min(storyboard.duration-.001,Math.max(0,ms/1000)))};renderAtTime(0);</script>
