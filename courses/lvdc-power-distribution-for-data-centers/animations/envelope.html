const STORY={"module": 2, "slide": 5, "asset": "envelope", "title": "What voltage reaches the rack?", "chapters": [{"title": "Two measurement boundaries", "narration": "A source and a rack can carry the same nominal voltage label without being compatible in every operating state. Measure at both ends of the actual connection. The rack sees source behavior combined with conductor drop and intermediate equipment. The outgoing and return conductors are both part of that circuit. The review must use the voltage delivered at the load terminals.", "start": 0.0, "speech_duration": 20.108480725623583, "end": 20.48848072562358}, {"title": "Distribution consumes margin", "narration": "The paper compares a short sidecar connection with a longer distribution run. In its resistive-drop example, the long run leaves twelve point four volts of a twenty-volt lower-side margin available for control. The example uses two hundred kilowatts, two hundred fifty amperes, and its stated conductor and distance assumptions. It demonstrates how distribution consumes margin; it is not a general cable-sizing recommendation.", "start": 20.48848072562358, "speech_duration": 22.755555555555556, "end": 43.62403628117914}, {"title": "Demand changes the interface", "narration": "Move now to a separate qualitative load-change case. Increasing demand raises current and conductor drop, so the voltage at the rack falls relative to the source. If the selected source reaches its current limit, it cannot necessarily maintain the requested voltage or power. The exact response depends on the source and load converters. Do not transfer the preceding example's numerical drop into this transient.", "start": 43.62403628117914, "speech_duration": 22.894875283446712, "end": 66.89891156462585}, {"title": "Magnitude and duration", "narration": "Compare the delivered-voltage excursion with the load's input requirements and permitted duration. One illustrative disturbance recovers within the assumed tolerance. Another remains outside that tolerance for too long. Equal nominal voltages cannot distinguish these outcomes. Stored energy, power availability and recovery behavior belong in the compatibility review along with the normal operating range.", "start": 66.89891156462585, "speech_duration": 22.569795918367348, "end": 89.84870748299319}, {"title": "Agree the complete envelope", "narration": "The evidence must connect three things: the validated source envelope, calculated or measured distribution effects, and the load's required voltage, time and power envelope. Returning sources or several loads reconnecting together can create another transient. Keep the paper's proposed numerical envelopes separate from settled interface requirements. The decision belongs at the connected interface, across all relevant operating states.", "start": 89.84870748299319, "speech_duration": 24.102312925170068, "end": 114.60099773242631}], "pages": [64, 65, 66, 67, 68, 69, 75, 76, 77, 78, 79], "caption": "Source and load terminals are different boundaries. The paper’s p. 76 resistive-drop example is followed by separate qualitative demand and voltage-time comparisons.", "duration": 114.60099773242631};
