const STORY={"module": 6, "slide": 6, "asset": "precharge", "title": "Inside a controlled rack connection", "chapters": [{"title": "Three different events", "narration": "A controlled rack connection contains several different electrical events. Follow the rack input from its connector, through the input filter and hot-swap controller, to the bulk capacitors and downstream converters. The initial connection, controlled capacitor charging, and application of the computing load have different purposes. Keeping them separate makes the interface easier to specify and test.", "start": 0.0, "speech_duration": 20.108480725623583, "end": 20.48848072562358}, {"title": "Initial connection", "narration": "First, consider the initial connection. Parasitic capacitances in wiring and components can draw a brief inrush even when the hot-swap controller is present. The paper describes precharge contacts and a current-limiting path to manage this event. Presence contacts provide connection information. Their geometry and sequence belong to the actual connector design; the functional drawing does not define a pinout.", "start": 20.48848072562358, "speech_duration": 22.755555555555556, "end": 43.62403628117914}, {"title": "Controlled bulk charging", "narration": "Now follow the hot-swap controller. It controls the current used to charge the downstream bulk capacitance. The capacitor voltage rises while charging current is limited. This is a separate charging interval from the initial connection spike. The implementer defines the current, duration, device stress limits and readiness criteria. Reaching a plausible voltage alone does not prove that every required condition is satisfied.", "start": 43.62403628117914, "speech_duration": 23.684353741496597, "end": 67.68839002267573}, {"title": "Enable the load", "narration": "After the required charging and readiness conditions have been met, the downstream converters can be enabled and the load applied. Input current now reflects the operating load. The current trace distinguishes the initial connection event, bulk charging and load application. The event spacing is expanded for explanation; these are not universal electrical time scales or specified current values.", "start": 67.68839002267573, "speech_duration": 21.037278911564627, "end": 89.10566893424036}, {"title": "Alternative: failed readiness", "narration": "Consider a different outcome. If charging fails to complete, or a monitored fault is detected, the control must follow its defined inhibit or turn-off response. Stored energy can remain after switching stops. Discharge, protective earth, isolation and verification still have separate responsibilities. Review the actual thresholds, sensing, reset conditions and evidence at the rack interface. A hot-swap function does not establish every safety function by itself.", "start": 89.10566893424036, "speech_duration": 28.421224489795918, "end": 118.17687074829932}], "pages": [175, 176, 177, 178, 179, 180, 181, 182], "caption": "Three distinct events: initial connection, controlled bulk charging and load application. Functional redraw based on paper Figures 9.6–9.10; event scales and levels are illustrative.", "duration": 118.17687074829932};
