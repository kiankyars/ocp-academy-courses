const STORY={"module": 3, "slide": 4, "asset": "midpoint", "title": "Follow the midpoint current", "chapters": [{"title": "Define the circuit", "narration": "Consider a bipolar arrangement with the positive conductor, midpoint M and negative conductor all distributed. One load is connected between the positive pole and M. The other is connected between M and the negative pole. Protective earth is drawn separately. The arrows use conventional current directions. This is a defined load circuit, not an earth-fault example.", "start": 0.0, "speech_duration": 21.037278911564627, "end": 21.417278911564626}, {"title": "Equal pole loading", "narration": "With equal pole-to-midpoint loads, matching currents flow in the two pole circuits. At the shared midpoint segment, their contributions cancel. Follow each complete loop through its source section and load. Zero current in that shared segment is a result of the balanced operating condition. It is not a reason to assume that the midpoint never carries current.", "start": 21.417278911564626, "speech_duration": 19.272562358276645, "end": 41.06984126984127}, {"title": "Positive-pole demand rises", "narration": "Increase the positive-pole load while the other load stays unchanged. The shared midpoint now carries the difference. The conductor indicators use normalized currents so the relationship is visible without prescribing ratings. The current returns in the intended midpoint circuit. Protective earth does not become its normal load return. The changed load condition changes which conductors are carrying current.", "start": 41.06984126984127, "speech_duration": 22.987755102040815, "end": 64.43759637188208}, {"title": "The imbalance reverses", "narration": "Consider another operating state. Reduce the positive-pole demand and increase the negative-pole demand. The mismatch reverses, and so does current in the shared midpoint segment. Workloads, staged startup and branch maintenance can all change the balance. A design snapshot with equal loads does not represent every ordinary operating condition.", "start": 64.43759637188208, "speech_duration": 19.4118820861678, "end": 84.22947845804988}, {"title": "Design for the operating states", "narration": "Hold the unequal-load condition and review the midpoint's thermal capability, switching and protection responsibilities. Any reduced midpoint rating depends on limiting imbalance or providing appropriate protection. Source capability and downstream compatibility also matter. Use the paper's configuration matrix and its footnotes for the actual arrangement. The useful habit is to follow the currents before turning a simplified balanced drawing into a design assumption.", "start": 84.22947845804988, "speech_duration": 24.61315192743764, "end": 109.49260770975057}], "pages": [83, 84, 85, 99, 100, 101], "caption": "Normalized conventional currents in a declared bipolar load circuit. Midpoint current follows the signed load difference; PE remains separate from normal load return.", "duration": 109.49260770975057};
