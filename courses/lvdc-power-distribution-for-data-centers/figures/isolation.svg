<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="682" viewBox="0 119 1920 682"><rect width="1920" height="682" fill="white" y="119"/><g font-family="Arial, sans-serif"><text x="330" y="180" font-size="39" fill="#343895" text-anchor="middle" font-weight="500"><tspan x="330" dy="0">Isolation before conversion</tspan></text><text x="1330" y="180" font-size="39" fill="#343895" text-anchor="middle" font-weight="500"><tspan x="1330" dy="0">Isolation within conversion</tspan></text><g data-box="120,261.2,360,220"><rect x="120" y="261.2" width="360" height="220" rx="18" fill="#F0F6E5" stroke="#343895" stroke-width="3"/><text x="300.0" y="360.4" font-size="40" fill="#34383C" text-anchor="middle" font-weight="500"><tspan x="300.0" dy="0">Transformer</tspan><tspan x="300.0" dy="49.6">isolation</tspan></text></g><path d="M 480 371.2 L 572 371.2" fill="none" stroke="#8DC63F" stroke-width="8"/><polygon class="arrowhead" points="572,380.2 572,362.2 590,371.2" fill="#8DC63F"/><g data-box="590,261.2,260,220"><rect x="590" y="261.2" width="260" height="220" rx="18" fill="white" stroke="#343895" stroke-width="3"/><text x="720.0" y="385.2" font-size="40" fill="#34383C" text-anchor="middle" font-weight="500"><tspan x="720.0" dy="0">AC/DC</tspan></text></g><g data-box="1050,261.2,680,220"><rect x="1050" y="261.2" width="680" height="220" rx="18" fill="#F0F6E5" stroke="#343895" stroke-width="3"/><text x="1390.0" y="360.4" font-size="40" fill="#34383C" text-anchor="middle" font-weight="500"><tspan x="1390.0" dy="0">Converter with an</tspan><tspan x="1390.0" dy="49.6">isolated stage</tspan></text></g><path d="M 930 150 L 930 505.473" fill="none" stroke="#CFD5DC" stroke-width="3"/><g data-box="215,525.2,1480,145"><rect x="215" y="525.2" width="1480" height="145" rx="18" fill="#EFF2F5" stroke="#343895" stroke-width="3"/><text x="955.0" y="611.7" font-size="40" fill="#34383C" text-anchor="middle" font-weight="500"><tspan x="955.0" dy="0">Verify downstream DC/DC isolation separately.</tspan></text></g><text x="960" y="766.8" font-size="32" fill="#747B83" text-anchor="middle" font-weight="500"><tspan x="960" dy="0">A converter symbol alone does not prove galvanic isolation.</tspan></text></g></svg>