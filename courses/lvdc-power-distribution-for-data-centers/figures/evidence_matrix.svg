<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800"><rect width="1920" height="800" fill="white"/><g transform="translate(0,-80)" font-family="Open Sans,Arial,sans-serif"><rect x="40" y="100" width="510" height="76" rx="10" fill="#343895"/><text x="64" y="150" font-size="31" fill="white" font-weight="600">Claim to review</text><rect x="570" y="100" width="610" height="76" rx="10" fill="#343895"/><text x="594" y="150" font-size="31" fill="white" font-weight="600">Required evidence</text><rect x="1200" y="100" width="680" height="76" rx="10" fill="#343895"/><text x="1224" y="150" font-size="31" fill="white" font-weight="600">Limit of that evidence</text><rect x="40" y="198" width="510" height="130" rx="10" fill="#F0F6E5"/><text x="64" y="237" font-size="28" fill="#343895" font-weight="600">Protective device is</text><text x="64" y="275" font-size="28" fill="#343895" font-weight="600">suitable</text><rect x="570" y="198" width="610" height="130" rx="10" fill="#F3F5F7"/><text x="594" y="237" font-size="28" fill="#242B35" font-weight="400">Product scope, ratings and</text><text x="594" y="275" font-size="28" fill="#242B35" font-weight="400">demonstrated functions</text><rect x="1200" y="198" width="680" height="130" rx="10" fill="#F3F5F7"/><text x="1224" y="237" font-size="28" fill="#242B35" font-weight="400">Does not establish system coordination or</text><text x="1224" y="275" font-size="28" fill="#242B35" font-weight="400">continuity.</text><rect x="40" y="345" width="510" height="130" rx="10" fill="#F0F6E5"/><text x="64" y="384" font-size="28" fill="#343895" font-weight="600">Healthy rack survives a</text><text x="64" y="422" font-size="28" fill="#343895" font-weight="600">fault</text><rect x="570" y="345" width="610" height="130" rx="10" fill="#F3F5F7"/><text x="594" y="384" font-size="28" fill="#242B35" font-weight="400">Representative system behavior versus</text><text x="594" y="422" font-size="28" fill="#242B35" font-weight="400">load voltage/time tolerance</text><rect x="1200" y="345" width="680" height="130" rx="10" fill="#F3F5F7"/><text x="1224" y="384" font-size="28" fill="#242B35" font-weight="400">Does not cover every untested operating</text><text x="1224" y="422" font-size="28" fill="#242B35" font-weight="400">configuration.</text><rect x="40" y="492" width="510" height="130" rx="10" fill="#F0F6E5"/><text x="64" y="531" font-size="28" fill="#343895" font-weight="600">Restart is controlled</text><rect x="570" y="492" width="610" height="130" rx="10" fill="#F3F5F7"/><text x="594" y="531" font-size="28" fill="#242B35" font-weight="400">Cooling/storage permissives,</text><text x="594" y="569" font-size="28" fill="#242B35" font-weight="400">exception tests and acceptance</text><text x="594" y="607" font-size="28" fill="#242B35" font-weight="400">records</text><rect x="1200" y="492" width="680" height="130" rx="10" fill="#F3F5F7"/><text x="1224" y="531" font-size="28" fill="#242B35" font-weight="400">Must represent installed wiring,</text><text x="1224" y="569" font-size="28" fill="#242B35" font-weight="400">configuration and conditions.</text><rect x="40" y="639" width="510" height="130" rx="10" fill="#F0F6E5"/><text x="64" y="678" font-size="28" fill="#343895" font-weight="600">Local deployment is accepted</text><rect x="570" y="639" width="610" height="130" rx="10" fill="#F3F5F7"/><text x="594" y="678" font-size="28" fill="#242B35" font-weight="400">Applicable installation and utility</text><text x="594" y="716" font-size="28" fill="#242B35" font-weight="400">requirements and evidence</text><rect x="1200" y="639" width="680" height="130" rx="10" fill="#F3F5F7"/><text x="1224" y="678" font-size="28" fill="#242B35" font-weight="400">A product report or pilot elsewhere is</text><text x="1224" y="716" font-size="28" fill="#242B35" font-weight="400">insufficient alone.</text><text x="40" y="852" font-size="28" fill="#343895" font-weight="600">Fictional proposal · name the method, acceptance criterion, owner and record for each claim.</text></g></svg>