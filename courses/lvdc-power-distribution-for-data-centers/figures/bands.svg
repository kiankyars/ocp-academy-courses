,825,1100,100"><rect x="420" y="825" width="1100" height="100" rx="18" fill="#F5F7FA" stroke="#747B83" stroke-width="3"/><text x="970.0" y="887.25" font-size="35" fill="#34383C" text-anchor="middle" font-weight="500"><tspan x="970.0" dy="0">B1  ·  Blackout</tspan></text></g><path d="M 260 910 L 260 113" fill="none" stroke="#343895" stroke-width="8"/><polygon class="arrowhead" points="269,113 251,113 260,95" fill="#343895"/><text x="170" y="493.3" font-size="35" fill="#343895" text-anchor="middle" font-weight="500"><tspan x="170" dy="0">Higher</tspan><tspan x="170" dy="43.4">voltage</tspan></text><text x="960" y="1000" font-size="32" fill="#747B83" text-anchor="middle" font-weight="500"><tspan x="960" dy="0">Behavior and duration define the requirement; numerical limits are not assigned here.</tspan></text></g></svg>