<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCP Ready Requirements for Energy Storage Systems poster</title>
  <style>
    @font-face {
      font-family: Lato;
      src: url(../../skills/academy-wizard/assets/fonts/lato2-bold.woff) format("woff");
      font-weight: 700;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 800px; height: 400px; }
    .poster {
      position: relative;
      width: 800px;
      height: 400px;
      overflow: hidden;
      color: #fff;
      font-family: Lato, Arial, sans-serif;
      background: linear-gradient(117deg, #1d2258 0%, #252a6b 60%, #343a86 100%);
    }
    .rail-band {
      position: absolute;
      inset: 0 0 0 auto;
      width: 228px;
      background: rgba(111, 117, 186, .32);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 38% 100%);
    }
    .rail {
      position: absolute;
      inset: 0 0 0 auto;
      width: 199px;
      background: linear-gradient(128deg, #97cc42 0%, #8dc63f 48%, #72aa32 100%);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 41% 100%);
    }
    .logo {
      position: absolute;
      top: 20px;
      left: 42px;
      width: 149px;
      height: auto;
    }
    .badge {
      position: absolute;
      top: 117px;
      left: 44px;
      height: 29px;
      padding: 0 14px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      background: #8dc63f;
      color: #1d2258;
      font-size: 14px;
      font-weight: 700;
    }
    h1 {
      position: absolute;
      top: 164px;
      left: 42px;
      width: 466px;
      margin: 0;
      font-size: 34px;
      line-height: 1.055;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 span { display: block; white-space: nowrap; }
    .divider {
      position: absolute;
      left: 44px;
      top: 323px;
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: #8dc63f;
    }
    .support {
      position: absolute;
      left: 42px;
      top: 344px;
      margin: 0;
      font-size: 16px;
      line-height: 23px;
      font-weight: 700;
    }
    .emblem {
      position: absolute;
      left: 529px;
      top: 76px;
      width: 246px;
      height: 246px;
      border: 4px solid #494d94;
      border-radius: 50%;
      background: radial-gradient(circle at 39% 35%, #fff 0%, #fff 52%, #f0f3f7 100%);
      box-shadow: 0 2px 0 rgba(255, 255, 255, .2) inset;
    }
    .emblem svg { display: block; width: 100%; height: 100%; }
    .traces {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="OCP Ready Requirements for Energy Storage Systems course poster">
    <div class="rail-band"></div>
    <div class="rail"></div>
    <svg class="traces" viewBox="0 0 800 400" aria-hidden="true">
      <g fill="none" stroke="#a8abd2" stroke-opacity=".42" stroke-width="2">
        <path d="M526 94h39M528 306h44M774 93h-42M777 307h-46" />
        <path d="M533 115a141 141 0 0 0 0 169M762 110a141 141 0 0 1 1 179" />
      </g>
      <g fill="#a8abd2" opacity=".52">
        <circle cx="526" cy="94" r="5"/><circle cx="528" cy="306" r="5"/>
        <circle cx="774" cy="93" r="5"/><circle cx="777" cy="307" r="5"/>
        <circle cx="533" cy="115" r="4"/><circle cx="533" cy="284" r="4"/>
      </g>
    </svg>
    <img class="logo" src="../../skills/academy-wizard/assets/ocp_academy_white.svg" alt="OCP Academy">
    <div class="badge">OCP ESS</div>
    <h1><span>OCP READY™</span><span>REQUIREMENTS FOR</span><span>ENERGY STORAGE</span><span>SYSTEMS</span></h1>
    <div class="divider"></div>
    <p class="support">Deployment, safety and standards</p>
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 238 238">
        <defs>
          <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3c498f"/>
            <stop offset=".53" stop-color="#638b70"/>
            <stop offset="1" stop-color="#8dc63f"/>
          </linearGradient>
        </defs>
        <rect x="39" y="39" width="160" height="160" rx="36" fill="url(#energy)"/>
        <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M57 119h32M149 119h32" stroke-width="7"/>
          <circle cx="54" cy="119" r="5" fill="#fff" stroke="none"/>
          <circle cx="184" cy="119" r="5" fill="#fff" stroke="none"/>
          <circle cx="119" cy="119" r="43" stroke-width="7"/>
          <path d="M91 122h14l9-22 12 39 9-20h13" stroke-width="7"/>
          <path d="M85 83c17-15 42-17 61-5" stroke-width="4"/>
          <path d="M140 70l9 10-13 4" stroke-width="4"/>
          <path d="M153 156c-18 17-42 18-61 6" stroke-width="4"/>
          <path d="M97 170l-9-10 13-4" stroke-width="4"/>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
